server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: hotel-billing-system
  
  # Default datasource: In-memory H2 database (PostgreSQL can be used by overriding via ENV)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  thymeleaf:
    cache: false
    mode: HTML

# Hotel Billing Custom Configuration (Rupees INR)
hotel:
  name: "Grand Horizon Luxury Palace & Resort"
  address: "100 Marine Bay Promenade, Mumbai, MH 400001"
  phone: "+91 (022) 5550-1999"
  email: "billing@grandhorizonresort.in"
  tax-rate-percentage: 12.0 # Default 12% GST
  currency-symbol: "₹"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
