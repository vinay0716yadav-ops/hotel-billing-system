version: '3.8'

services:
  # Hotel Billing Application Service
  hotel-billing-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotel-billing-system:latest
    container_name: hotel-billing-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Connects to PostgreSQL service below (or defaults to embedded H2 if DB is disabled)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/hotel_billing_db
      - SPRING_DATASOURCE_USERNAME=hotel_admin
      - SPRING_DATASOURCE_PASSWORD=hotel_secret_pass
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - hotel-network

  # Optional Production Database (PostgreSQL 16)
  postgres-db:
    image: postgres:16-alpine
    container_name: hotel-billing-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=hotel_billing_db
      - POSTGRES_USER=hotel_admin
      - POSTGRES_PASSWORD=hotel_secret_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_admin -d hotel_billing_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

volumes:
  postgres_data:
    driver: local

networks:
  hotel-network:
    driver: bridge
