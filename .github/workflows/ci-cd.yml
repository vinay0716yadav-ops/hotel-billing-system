name: Hotel Billing System CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Ensure only one deploy per branch runs at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: hotel-billing-system
  JAVA_VERSION: '17'
  DISTRIBUTION: 'temurin'

jobs:
  # ==========================================
  # Job 1: Build & Automated Testing
  # ==========================================
  test-and-build:
    name: 🧪 Maven Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ☕ Set up Java ${{ env.JAVA_VERSION }} (${{ env.DISTRIBUTION }})
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: maven

      - name: 📦 Compile & Run Test Suite with Maven
        run: mvn clean verify -B

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7

  # ==========================================
  # Job 2: Docker Build & Push to Docker Hub
  # ==========================================
  docker-build-push:
    name: 🐳 Build & Push Docker Image
    needs: test-and-build
    runs-on: ubuntu-latest
    # Only push to Docker Hub on main branch commits, not on PRs
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🔧 Set up QEMU (Multi-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: ⚡ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Generate GitHub Actions Step Summary
        run: |
          echo "### 🚀 Deployment Summary - Docker Image Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Repository** | \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA Tag** | \`sha-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Tag** | \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | \`${{ github.actor }}\` via \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Pull command:** \`docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
